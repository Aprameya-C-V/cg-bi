[project]
name = "cg-bi"
version = "0.1.0"
description = "Confidence-gated cascade triage for multimodal wind turbine blade inspection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgbi"]
